name: Build & Test WonderSprout

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build exe
        run: |
          bash build/build_windows.sh

      - name: Verify PE format and imports
        run: |
          file dist/wondersprout.exe
          file dist/wondersprout.exe | grep -q 'PE32+'
          x86_64-w64-mingw32-objdump -p dist/wondersprout.exe | grep 'DLL Name' || true
          # Ensure no non-system DLLs
          ! x86_64-w64-mingw32-objdump -p dist/wondersprout.exe | grep -i 'DLL Name' | grep -vE 'KERNEL32|USER32|GDI32|WINMM|SHELL32|ole32|msvcrt|ADVAPI32' || true

      - name: Generate checksum
        run: |
          cd dist
          sha256sum wondersprout.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wondersprout-windows-x64
          path: |
            dist/wondersprout.exe
            dist/SHA256SUMS.txt

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wondersprout.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-core:
    name: Test core logic (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run core tests
        run: |
          cd build
          make clean test
