name: Build WonderSprout

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build wondersprout.exe
        run: |
          chmod +x build/build_windows.sh
          ./build/build_windows.sh

      - name: Verify PE binary
        run: |
          file dist/wondersprout.exe
          echo "--- Imports ---"
          x86_64-w64-mingw32-objdump -p dist/wondersprout.exe | grep 'DLL Name' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wondersprout-windows-x64
          path: dist/wondersprout.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wondersprout.exe

  test-core-linux:
    name: Test core (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run core tests
        run: |
          chmod +x build/test_core.sh
          ./build/test_core.sh
